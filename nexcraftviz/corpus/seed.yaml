- name: radial_successor_coverage
  chart_type: radial_progress
  business_goal: Convey coverage or completion of a defined effort — a single percentage that everyone tracks the same way.
  overview: A closed ring filled clockwise to show how much of the goal is complete.
  insight: Read it as a fraction of a target — anything under 100% has remaining work; over 100% has stretched past goal (rare but worth a note).
  purpose: Closed ring filling clockwise to a percentage — a compact status glyph.
  goal: Show single % of goal in the space of a small card.
  use_when:
    - Single %, no target zones
    - The metric IS the story
    - Fits inside a wider card
  do_not_use_when:
    - Need target zones → gauge
    - Multiple KPIs → multi_kpi_grid
  kinds:
    intent: target-vs-actual
    shape: single-value
    family: vega-lite
  data_shape:
    columns:
      - {name: value, type: number, range: "[0, 100]"}
  vega_lite_spec: |-
    {
      "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
      "width": 180,
      "height": 180,
      "background": "transparent",
      "transform": [
        {
          "fold": [
            "value",
            "remainder"
          ],
          "as": [
            "kind",
            "amount"
          ]
        }
      ],
      "layer": [
        {
          "mark": {
            "type": "arc",
            "innerRadius": 60,
            "outerRadius": 80,
            "cornerRadius": 4
          },
          "encoding": {
            "theta": {
              "field": "amount",
              "type": "quantitative"
            },
            "color": {
              "field": "kind",
              "type": "nominal",
              "scale": {
                "domain": [
                  "value",
                  "remainder"
                ],
                "range": [
                  "#0C8BA6",
                  "#E4E8EC"
                ]
              },
              "legend": null
            },
            "order": {
              "field": "kind",
              "type": "nominal"
            }
          }
        },
        {
          "mark": {
            "type": "text",
            "fontSize": 28,
            "fontWeight": 700,
            "align": "center",
            "baseline": "middle"
          },
          "encoding": {
            "text": {
              "value": "center"
            }
          }
        }
      ],
      "data": {
        "values": [
          {
            "value": 78,
            "remainder": 22
          }
        ]
      }
    }
  example_questions:
