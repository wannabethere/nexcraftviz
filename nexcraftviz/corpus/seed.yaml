# chart_pairs seed set — retrieved at chart-generation time as few-shot examples.
# GENERATED by scratchpad/build_seed.py — edit that script (or add pairs to
# it) rather than hand-editing this file. Fields per pair:
#   name, chart_type, business_goal, overview, insight,   # customer-facing
#   purpose, goal, use_when, do_not_use_when,             # internal (retrieval)
#   kinds{intent,shape,family[,cell_renderers]}, data_shape,
#   vega_lite_spec OR columns_schema, example_questions
#
# Two-tier model:
#   tenant: global — this file's shared pairs live in `chart_pairs_global`.
#                    Every tenant retrieves from here.
#   tenant: <name> — per-tenant overlay collections are `chart_pairs_<name>`.
#                    Tenants populate their own collection with domain-specific
#                    renames, custom KPIs, or approved published dashboards.

version: 2
tenant: global

pairs:

- name: bar_top_courses_completions
  chart_type: bar
  business_goal: Prioritize where to invest — top items reveal the highest-leverage focus.
  overview: A ranked list of 5 items sorted from highest to lowest by the measure asked.
  insight: "Focus attention on the top row and the drop-off between top and middle — that's where the story usually is. The tail is where a modest intervention can move the needle."
  purpose: "Top-N horizontal bar sorted descending. The default 'which items are highest' answer."
  goal: Rank items by a single measure. Reader scans top-to-bottom.
  use_when:
    - "Question uses 'top', 'most', 'highest', 'ranked'"
    - Categorical dimension + one numeric measure
    - N between 3 and 25 items
  do_not_use_when:
    - Data has natural order → line
    - Comparing sub-groups within a category → stacked_bar / grouped_bar
  kinds:
    intent: ranking
    shape: categorical-few
    family: vega-lite
  data_shape:
    columns:
      - {name: category, type: string}
      - {name: value, type: number}
  vega_lite_spec: |-
    {
      "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
      "width": 420,
      "height": 260,
      "background": "transparent",
      "mark": {
        "type": "bar",
        "cornerRadius": 3,
        "color": "#0C8BA6"
      },
      "encoding": {
        "y": {
          "field": "category",
          "type": "nominal",
          "sort": "-x",
          "axis": {
            "title": null
          }
        },
        "x": {
          "field": "value",
          "type": "quantitative",
          "axis": {
            "title": null
          }
        },
        "tooltip": [
          {
            "field": "category"
          },
          {
            "field": "value"
          }
        ]
      },
      "data": {
        "values": [
          {
            "category": "Onboarding 101",
            "value": 342
          },
          {
            "category": "Safety Refresher",
            "value": 287
          },
          {
            "category": "Ethics & Compliance",
            "value": 214
          },
          {
            "category": "Product Intro",
            "value": 181
          },
          {
            "category": "Sales Fundamentals",
            "value": 156
          }
        ]
      }
