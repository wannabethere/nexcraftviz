- name: boxplot_completion_time_by_dept
  chart_type: boxplot
  business_goal: Compare the SPREAD of a measure across categories — averages hide variance, and variance is often the risk.
  overview: One box per category showing median, quartiles, and outlier points.
  insight: "Categories with the widest boxes have the biggest variance — that's inconsistency risk. Outliers above/below whiskers are the individual cases to look at."
  purpose: Box-and-whisker per category — quartiles + median + outliers.
  goal: Compare distributions across categories in one chart.
  use_when:
    - Numeric measure across multiple categories
    - Question about spread within categories, not just averages
