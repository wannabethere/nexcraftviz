  purpose: Bridge chart of signed deltas summing from start to end total.
  goal: "Decompose 'why did X change' into additive/subtractive drivers."
  use_when:
    - "Question is 'why did X change'"
    - Data is a sequence of signed deltas + a start value
    - Bridging period-over-period totals
  do_not_use_when:
    - Continuous trend → line
    - Categorical values not deltas → bar
  kinds:
    intent: flow
    shape: categorical-few
    family: vega-lite
  data_shape:
    columns:
      - {name: driver, type: string}
      - {name: delta, type: number}
      - {name: is_total, type: boolean}
  vega_lite_spec: |-
