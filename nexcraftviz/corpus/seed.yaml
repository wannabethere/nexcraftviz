- name: histogram_tenure_distribution
  chart_type: histogram
  business_goal: Understand the SHAPE of a distribution, not just its average — a single number can hide a bimodal or skewed reality.
  overview: The frequency of values across binned ranges of a single numeric measure.
  insight: "Look at the shape: a single peak (normal), two peaks (bimodal — often means two populations mixed), or a long tail (skew)."
  purpose: Frequency distribution of a single numeric variable, binned.
