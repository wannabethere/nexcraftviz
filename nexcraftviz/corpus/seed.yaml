      "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
      "width": 480,
      "height": 260,
      "background": "transparent",
      "transform": [
        {
          "window": [
            {
              "op": "sum",
              "field": "delta",
              "as": "running"
            }
          ]
        },
        {
          "calculate": "datum.is_total ? 0 : datum.running - datum.delta",
          "as": "bar_start"
