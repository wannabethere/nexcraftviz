  business_goal: Give the reader a scannable list of individual entities with the signals they need to take action.
  overview: A row per entity, with per-column visual encodings (avatars, progress bars, status pills, sparklines) matched to the data.
  insight: Sort by the column that matters most for the decision — usually risk or completion. The top few rows are the answer; scroll for depth.
  purpose: "Rich table with per-column renderers: avatar_name, badge, heatmap_cell, number."
  goal: Row-per-entity table where each column can be text, avatar, progress bar, sparkline, pill, badge, heatmap cell, or trend arrow.
  use_when:
    - Result rows are entities the reader browses (people, courses, tasks)
    - At least one column benefits from richer rendering than plain text
    - Fewer than ~50 rows (else offer aggregate summary first)
  do_not_use_when:
    - Answer is a summary chart, not a browseable list
    - ">100 rows without filtering"
  kinds:
    intent: ranking
    shape: categorical-many
    family: table-with-cells
    cell_renderers:
      - avatar_name
      - number
      - heatmap_cell
      - badge
  data_shape:
    columns:
      - {name: name, type: string}
      - {name: team_size, type: string}
      - {name: attrition_rate, type: string}
      - {name: flag, type: string}
  columns_schema: |-
    [
      {
        "field": "name",
        "header": "Manager",
        "render": "avatar_name",
        "subtitle_field": "department"
      },
      {
        "field": "team_size",
        "header": "Team",
        "render": "number"
      },
      {
        "field": "attrition_rate",
        "header": "Attrition %",
        "render": "heatmap_cell",
        "min": 0,
        "max": 30
      },
      {
        "field": "flag",
        "header": "Flag",
        "render": "badge",
        "color_map": {
          "Elevated": "fail",
          "Watch": "fix",
          "Normal": "pass"
        }
      }
    ]
  example_questions:
    - Which managers have elevated attrition?
    - Show attrition-rate table by manager
    - Managers with attrition flags

