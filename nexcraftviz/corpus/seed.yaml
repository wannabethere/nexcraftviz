- name: funnel_recruitment_pipeline
  chart_type: funnel
  business_goal: Identify the biggest drop-off in a sequential pipeline so we can invest in the leakiest stage.
  overview: A stage-by-stage bar chart with counts at each stage and conversion percentage between stages.
  insight: The BIGGEST between-stage drop is where a small intervention pays off most. Stage-to-stage conversion labels tell you where the pipeline is bleeding.
  purpose: "Sequential-pipeline chart: stages with counts and between-stage conversion."
  goal: Show cohort attrition through linear pipeline; find biggest drop-off.
  use_when:
    - Sequential stages (sourcing → application → offer → hire)
    - Each stage has a count
    - Question emphasizes drop-off
  do_not_use_when:
    - Cross-flows / back-edges → real sankey
    - "Order doesn't matter → bar"
  kinds:
    intent: flow
    shape: categorical-few
    family: vega-lite
  data_shape:
    columns:
      - {name: stage, type: string, ordered: true}
      - {name: count, type: number}
  vega_lite_spec: |-
    {
      "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
      "width": 520,
      "height": 240,
      "background": "transparent",
      "transform": [
        {
          "window": [
            {
              "op": "lag",
              "field": "count",
              "as": "prev"
            }
          ],
          "sort": [
            {
              "field": "stage"
            }
          ]
        },
        {
          "calculate": "datum.prev ? round(100 * datum.count / datum.prev) + '%' : ''",
          "as": "conv_label"
        }
      ],
      "layer": [
        {
          "mark": {
            "type": "bar",
            "cornerRadius": 6,
            "size": 36
          },
          "encoding": {
            "y": {
              "field": "stage",
              "type": "nominal",
              "sort": null,
              "axis": {
                "title": null
              }
            },
            "x": {
              "field": "count",
              "type": "quantitative",
              "axis": {
                "title": null
              }
            },
            "color": {
              "field": "stage",
              "type": "nominal",
              "scale": {
                "scheme": "teals"
              },
              "legend": null
            },
            "tooltip": [
              {
                "field": "stage"
              },
              {
                "field": "count"
              },
              {
                "field": "conv_label",
                "title": "vs prev"
              }
            ]
          }
        },
        {
          "mark": {
            "type": "text",
            "align": "left",
            "dx": 6,
            "color": "#5F6E7C",
            "fontSize": 11
          },
          "encoding": {
            "y": {
              "field": "stage",
              "type": "nominal",
              "sort": null
            },
            "x": {
              "field": "count",
              "type": "quantitative"
            },
            "text": {
              "field": "conv_label"
            }
          }
        }
      ],
      "data": {
