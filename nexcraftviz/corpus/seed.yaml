  purpose: "Rich table with per-column renderers: number, progress_bar, sparkline, text."
  goal: Row-per-entity table where each column can be text, avatar, progress bar, sparkline, pill, badge, heatmap cell, or trend arrow.
  use_when:
    - Result rows are entities the reader browses (people, courses, tasks)
    - At least one column benefits from richer rendering than plain text
    - Fewer than ~50 rows (else offer aggregate summary first)
  do_not_use_when:
    - Answer is a summary chart, not a browseable list
    - ">100 rows without filtering"
  kinds:
    intent: ranking
    shape: nested-series
    family: table-with-cells
    cell_renderers:
      - text
      - number
      - progress_bar
      - sparkline
  data_shape:
    columns:
      - {name: query, type: string}
      - {name: searches, type: string}
      - {name: ctr, type: string}
      - {name: trend, type: string}
  columns_schema: |-
    [
      {
        "field": "query",
        "header": "Query",
        "render": "text"
      },
      {
        "field": "searches",
        "header": "Searches",
        "render": "number"
      },
      {
        "field": "ctr",
        "header": "CTR",
        "render": "progress_bar",
        "max": 100
      },
      {
        "field": "trend",
        "header": "Trend",
        "render": "sparkline"
      }
    ]
  example_questions:
    - Show top search queries with click-through rate
    - What are learners searching for most?
    - Search-query leaderboard

