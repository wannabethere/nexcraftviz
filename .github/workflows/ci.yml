name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # The whole suite runs offline against stub models: no API key, no network.
      - run: pip install -e ".[dev,render,app,openai,mcp]"
      - run: ruff check nexcraftviz harness tests
      - run: pytest -q
